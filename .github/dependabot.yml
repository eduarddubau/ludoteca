# Pinned SHAs are immutable but they do not age well on their own: this workflow sat on
# @v4 through three major releases and only a runtime deprecation warning surfaced it.
# Dependabot bumps the SHA and the version comment beside it together.
#
# Note the trade this accepts. GitHub does not raise vulnerability *alerts* for actions
# pinned to a SHA — only for semver ranges — so these version updates are the whole
# mechanism, not a supplement to alerting.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A week's wait: a compromised release is usually caught and pulled within days.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  # Minor and patch updates arrive as one PR; each major gets its own, so CI tests it alone.
  # No cooldown: for npm, Dependabot resolves the whole tree as of the cooldown date, so a
  # lockfile holding any release younger than that fails with "No matching version found".
  - package-ecosystem: npm # zizmor: ignore[dependabot-cooldown]
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
        # 0.x minors break like majors.
        exclude-patterns: ['tsdown']
    ignore:
      # Types follow the Node that Electron bundles, not the newest Node. Raise by hand when
      # Electron's Node major changes.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint peers typescript <6.1. Remove once its range admits 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
