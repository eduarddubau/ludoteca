name: Release

# Tag-driven so an artifact traces to one commit, plus manual for dry runs. Nothing is
# built on push: a release should be a decision, not a side effect of merging.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read by default; only the job that publishes gets write. The build job runs npm
# install scripts and electron-builder's downloads, which is the last code that should
# be holding a token that can rewrite the repository.
permissions:
  contents: read

# One release at a time: two tags pushed close together would otherwise race.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Node 22: npm 11 gates install scripts behind an approval prompt that cannot be
      # answered in CI, and this is also what tsup targets.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Must precede typecheck: packages/ui resolves @ludoteca/core to dist/index.d.ts,
      # which a fresh checkout has not built yet. Verified by deleting core/dist locally
      # — vue-tsc fails with "Cannot find module '@ludoteca/core'".
      - run: npm run build

      - run: npm run typecheck
      - run: npm run lint

      - name: Package
        run: npm run dist --workspace @ludoteca/electron

      # Checksums are the only provenance an unsigned build has, so they are generated
      # next to the artifacts rather than by hand afterwards.
      - name: Checksum
        shell: bash
        working-directory: apps/electron/release
        run: |
          shopt -s nullglob
          files=(*.AppImage *.rpm *.exe)
          [ ${#files[@]} -gt 0 ] || { echo "No artifacts were produced."; exit 1; }
          sha256sum "${files[@]}" > "SHA256SUMS-${{ matrix.name }}.txt"
          cat "SHA256SUMS-${{ matrix.name }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: ludoteca-${{ matrix.name }}
          path: |
            apps/electron/release/*.AppImage
            apps/electron/release/*.rpm
            apps/electron/release/*.exe
            apps/electron/release/SHA256SUMS-*.txt
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # gh is preinstalled on the runner, so this needs no third-party action in the
      # step that handles the release token.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          find artifacts -type f -print
          cat artifacts/*/SHA256SUMS-*.txt > SHA256SUMS.txt

          # An array, not unquoted $(...): productName is config, and the day it gains a
          # space the split would upload the wrong paths silently.
          mapfile -t assets < <(
            find artifacts -type f \( -name '*.AppImage' -o -name '*.rpm' -o -name '*.exe' \)
          )
          [ ${#assets[@]} -gt 0 ] || { echo "No artifacts to publish."; exit 1; }

          notes=$(cat <<'TXT'
          Unsigned builds. Verify against SHA256SUMS.txt before running.

          Windows shows a SmartScreen warning because the executable is not signed:
          More info -> Run anyway. That warning is accurate — check the checksum first.

          Linux: the AppImage needs FUSE 2, which current Fedora does not install by
          default. Use the rpm there, or run the AppImage with --appimage-extract-and-run.
          TXT
          )

          # create is not idempotent, so a re-run of the same tag would fail outright.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --clobber SHA256SUMS.txt "${assets[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" \
              --notes "${notes}" SHA256SUMS.txt "${assets[@]}"
          fi
