appId: dev.ludoteca.app
productName: Ludoteca
# Without this the binary is named after the workspace package: "@ludotecaelectron".
executableName: ludoteca
directories:
  output: release
  buildResources: build

# dist/ is the whole app: bundled main and preload, plus the UI copied in by the build
# script. Nothing outside this directory is reachable from a packaged bundle.
files:
  - dist/**
  - package.json

asar: true

# Without this the rpm is named from the package name and lands at release/@ludoteca/…,
# a nested path nothing globbing release/*.rpm would find.
artifactName: ${productName}-${version}-${arch}.${ext}

# Closes the escape hatches a packaged Electron ships with. runAsNode is the sharp one:
# ELECTRON_RUN_AS_NODE=1 runs arbitrary Node using the app's own binary.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  # The app is served over its own scheme, so file:// needs no extra privileges.
  grantFileProtocolExtraPrivileges: false

linux:
  target:
    - AppImage
    - rpm
  category: Game
  synopsis: One library across Steam, GOG and Epic

# Unsigned. Since 2023 a code-signing certificate has to live on a hardware token or a
# cloud signing service, so there is no local key to point at here. SmartScreen will
# show a full-screen warning until that is sorted; say so wherever the build is handed
# out rather than letting someone hit it cold.
win:
  target:
    - nsis
  # ASAR integrity is actually enforced here, unlike Linux, from Electron 30 on.

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Per-user, so installing needs no administrator prompt.
  perMachine: false
